[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "datasets>=2.19",
    "groq>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

serve = ["fastapi>=0.110", "uvicorn>=0.29", "huggingface-hub>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
